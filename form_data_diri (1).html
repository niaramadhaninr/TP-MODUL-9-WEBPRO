<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px 16px;
        }
        .card {
            background: #ffffff;
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 26px 26px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        h1 {
            font-size: 28px;
            margin: 0 0 14px;
        }
        label.judul {
            display: block;
            font-weight: bold;
            font-size: 18px;
            margin: 12px 0 6px;
        }
        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }
        .hobi label {
            display: block;
            font-size: 18px;
            margin: 4px 0;
            cursor: pointer;
        }
        .hobi input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 6px;
        }
        button {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            padding: 11px 16px;
            font-size: 18px;
            margin-top: 12px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0069d9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Formulir Data Diri</h1>

        <form action="proses_data_diri.php" method="POST">
            <label class="judul" for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required>

            <label class="judul" for="tanggal_lahir">Tanggal Lahir:</label>
            <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>

            <label class="judul">Hobi:</label>
            <div class="hobi">
                <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                <label><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
                <label><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
            </div>

            <button type="submit">Kirim</button>
        </form>
    </div>
</body>
</html>
